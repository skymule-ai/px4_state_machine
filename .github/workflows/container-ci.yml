name: Mullet Container CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  container-build-test:
    name: Container CI (Humble)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/skymule-ai/px4-sitl:v1.16.1
      options: --user 0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create workspace and fetch deps
        run: |
          mkdir -p /tmp/ws/src
          ln -s "$GITHUB_WORKSPACE" /tmp/ws/src/px4_state_machine
          git clone --depth 1 https://github.com/PX4/px4_msgs.git /tmp/ws/src/px4_msgs

      - name: Install dependencies
        run: |
          source /opt/ros/humble/setup.bash
          cd /tmp/ws
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Python syntax checks
        run: |
          cd /tmp/ws/src/px4_state_machine
          python3 -m py_compile scripts/*.py launch/*.py

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          cd /tmp/ws
          colcon build --event-handlers console_direct+ --packages-up-to px4_state_machine

      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          source /tmp/ws/install/setup.bash
          cd /tmp/ws
          colcon test --event-handlers console_direct+ --packages-select px4_state_machine

      - name: Test results
        if: always()
        run: |
          source /opt/ros/humble/setup.bash
          source /tmp/ws/install/setup.bash
          cd /tmp/ws
          colcon test-result --verbose
